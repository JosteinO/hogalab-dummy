# Copy to .github/workflows/deploy.yml in your project.
# Push to main -> test env. Manual run or tag v* -> prod env.
# Project needs a docker-compose.yml; each service exposed via Caddy gets labels (see README).
name: deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      env: { description: "test or prod", default: "prod" }
jobs:
  deploy:
    runs-on: [self-hosted, hogalab]
    env:
      APP: ${{ github.event.repository.name }}
      ENV: ${{ github.event.inputs.env || (startsWith(github.ref, 'refs/tags/') && 'prod' || 'test') }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          TARGET=~/hogalab/deploy/$APP/$ENV
          mkdir -p "$TARGET" && rsync -a --delete --exclude .git ./ "$TARGET"/
          cd "$TARGET"
          [ -f ~/hogalab/deploy/$APP/$ENV.env ] && cp ~/hogalab/deploy/$APP/$ENV.env .env || true
          docker compose -p "$APP-$ENV" up -d --build --remove-orphans
          docker image prune -f
