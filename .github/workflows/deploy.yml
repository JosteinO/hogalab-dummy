# Copy to .github/workflows/deploy.yml in your project. Project needs k8s/base + k8s/overlays/{test,prod}
# (see hosting/macbook/templates/k8s). Push to main -> test. Tag v* or manual run -> prod (or chosen target).
name: deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "test or prod"
        default: "prod"
jobs:
  deploy:
    runs-on: [self-hosted, hogalab]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          APP: ${{ github.event.repository.name }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TARGET" ]; then TARGET_ENV="$INPUT_TARGET"
          elif [[ "$REF" == refs/tags/* ]]; then TARGET_ENV=prod
          else TARGET_ENV=test; fi
          echo "Deploying $APP to $TARGET_ENV"
          "$HOME/hogalab/hosting/macbook/bin/k8s-deploy.sh" "$APP" "$TARGET_ENV" "${SHA:0:12}"
