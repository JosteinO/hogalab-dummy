# Copy to .github/workflows/deploy.yml in your project.
# Push to main -> test env. Tag v* or manual run -> prod env (or choose).
# Project needs a docker-compose.yml; services exposed via Caddy get labels (see hosting/macbook/README.md).
name: deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "test or prod"
        default: "prod"
jobs:
  deploy:
    runs-on: [self-hosted, hogalab]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          APP: ${{ github.event.repository.name }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TARGET" ]; then ENV="$INPUT_TARGET"
          elif [[ "$REF" == refs/tags/* ]]; then ENV=prod
          else ENV=test; fi
          TARGET="$HOME/hogalab/deploy/$APP/$ENV"
          echo "Deploying $APP to $ENV at $TARGET"
          mkdir -p "$TARGET" && rsync -a --delete --exclude .git ./ "$TARGET"/
          cd "$TARGET"
          [ -f "$HOME/hogalab/deploy/$APP/$ENV.env" ] && cp "$HOME/hogalab/deploy/$APP/$ENV.env" .env || true
          docker compose -p "$APP-$ENV" up -d --build --remove-orphans
          docker image prune -f
